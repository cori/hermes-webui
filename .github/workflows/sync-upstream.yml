name: sync-upstream
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/nesquena/hermes-webui.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Rebase local commits onto upstream/master
        run: git rebase upstream/master

      - name: Push rebased master
        run: git push --force-with-lease origin master
