name: Build on Push

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cori/hermes-webui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-appstore:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cori/rtappstore
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update hermes-webui version
        id: version
        run: |
          # Get the latest tag from hermes-webui that matches vX.Y.Z
          LATEST_TAG=$(git ls-remote --tags https://github.com/cori/hermes-webui.git 'v*.*.*' | \
            grep -v '\^{}' | \
            sed 's/.*refs\/tags\///' | \
            sort -V | \
            tail -1)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "No version tag found"
            exit 1
          fi
          
          VERSION=${LATEST_TAG#v}
          echo "Latest tag: $LATEST_TAG"
          echo "Version: $VERSION"
          
          # Update config.json
          jq --arg version "$VERSION" \
             --arg tipi_version "$(jq -r '.tipi_version + 1' apps/hermes-webui/config.json)" \
             --arg updated_at "$(date +%s)000" \
             '.version = $version | .tipi_version = ($tipi_version | tonumber) | .updated_at = ($updated_at | tonumber)' \
             apps/hermes-webui/config.json > apps/hermes-webui/config.json.tmp && \
            mv apps/hermes-webui/config.json.tmp apps/hermes-webui/config.json
          
          # Update docker-compose.json
          jq --arg version "$VERSION" \
             '.services[0].image = "ghcr.io/cori/hermes-webui:" + $version' \
             apps/hermes-webui/docker-compose.json > apps/hermes-webui/docker-compose.json.tmp && \
            mv apps/hermes-webui/docker-compose.json.tmp apps/hermes-webui/docker-compose.json
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tipi_version=$(jq -r '.tipi_version' apps/hermes-webui/config.json)" >> "$GITHUB_OUTPUT"

      - name: Validate with bun test
        run: |
          bun install
          bun test

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          BRANCH="update-hermes-webui-${{ steps.version.outputs.version }}-${{ github.sha::7 }}"
          git checkout -b "$BRANCH"
          
          git add apps/hermes-webui/config.json apps/hermes-webui/docker-compose.json
          git commit -m "app: update hermes-webui to ${{ steps.version.outputs.version }} (auto from push)"
          
          git push origin "$BRANCH"
          
          gh pr create \
            --repo cori/rtappstore \
            --base main \
            --head "$BRANCH" \
            --title "app: update hermes-webui to ${{ steps.version.outputs.version }} (auto)" \
            --body "Automated update from hermes-webui push to master.

            - Version: ${{ steps.version.outputs.version }}
            - tipi_version: ${{ steps.version.outputs.tipi_version }}
            - Image: ghcr.io/cori/hermes-webui:${{ steps.version.outputs.version }}
            
            All validation tests pass."